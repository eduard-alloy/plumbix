# Two AI validators judging with different reviewer profiles (WU-028).
version: 1
steps:
  - name: test
    image: golang:1.27
    run: go test ./...
  - name: ai-claude
    image: plumbix-ai-validator:dev
    validator: true
    needs: [test]
  - name: ai-grok
    image: plumbix-ai-validator:dev
    validator: true
    reviewer: grok-4
    advisory: true
    needs: [test]
  - name: ai-review
    validator: true
    external: true
    reviewer: claude
    needs: [test]
