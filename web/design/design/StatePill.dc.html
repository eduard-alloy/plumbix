<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span title="{{ label }}" style="position:relative;display:inline-flex;align-items:center;gap:5px;height:{{ h }};padding:{{ pad }};border-radius:4px;background:{{ bg }};color:{{ fg }};font-family:var(--ui);font-size:12px;font-weight:500;line-height:1;white-space:nowrap;vertical-align:middle;flex:none"><sc-if value="{{ showIcon }}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:block;flex:none"><circle cx="8" cy="8" r="5.75" stroke="currentColor" stroke-width="1.5" fill="{{ cf }}" stroke-dasharray="{{ da }}"></circle><path d="{{ d }}" stroke="{{ ps }}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="{{ pf }}"></path></svg></sc-if><sc-if value="{{ showLabel }}" hint-placeholder-val="{{ true }}"><span>{{ label }}</span></sc-if><sc-if value="{{ srOnly }}"><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">{{ label }}</span></sc-if></span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:160,&quot;height&quot;:40},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;running&quot;,&quot;approved&quot;,&quot;fix_requested&quot;,&quot;rejected&quot;,&quot;needs_human&quot;,&quot;escalated&quot;,&quot;merged&quot;,&quot;closed&quot;,&quot;finished&quot;,&quot;errored&quot;,&quot;cancelled&quot;,&quot;succeeded&quot;,&quot;failed&quot;,&quot;timed_out&quot;,&quot;skipped&quot;,&quot;queued&quot;,&quot;met&quot;,&quot;unmet&quot;,&quot;unknown&quot;,&quot;pending&quot;,&quot;blocker&quot;,&quot;major&quot;,&quot;minor&quot;,&quot;human_required&quot;,&quot;alert&quot;,&quot;resolved&quot;,&quot;info&quot;],&quot;default&quot;:&quot;approved&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pill&quot;,&quot;icon&quot;,&quot;plain&quot;,&quot;text&quot;],&quot;default&quot;:&quot;pill&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONE = {
  neutral: ['var(--s-neutral)', 'var(--s-neutral-bg)'],
  blue: ['var(--s-blue)', 'var(--s-blue-bg)'],
  green: ['var(--s-green)', 'var(--s-green-bg)'],
  amber: ['var(--s-amber)', 'var(--s-amber-bg)'],
  red: ['var(--s-red)', 'var(--s-red-bg)'],
  violet: ['var(--s-violet)', 'var(--s-violet-bg)'],
  ink: ['var(--text)', 'var(--surface-2)']
};
const P = {
  check: 'M5.4 8.3l1.8 1.8 3.4-3.8', x: 'M6 6l4 4M10 6l-4 4', bang: 'M8 4.9v3.5M8 11v.01',
  up: 'M8 11V5.4M5.8 7.5 8 5.3l2.2 2.2', ret: 'M10.6 10.8V9.4a2 2 0 0 0-2-2H5.6M7.3 5.6 5.5 7.4l1.8 1.8',
  slash: 'M5.5 10.5l5-5', clock: 'M8 5v3.2l2 1.3', dash: 'M5.4 8h5.2',
  q: 'M6.5 6.6a1.5 1.5 0 1 1 2.1 1.4c-.4.2-.6.5-.6 1v.3M8 11v.01', info: 'M8 7.4v3.3M8 5.1v.01', none: ''
};
// [label, tone, icon, filled, dashed]
const S = {
  open: ['Open', 'neutral', 'none'], running: ['Running', 'blue', 'half'], approved: ['Approved', 'green', 'check'],
  fix_requested: ['Fix requested', 'amber', 'ret'], rejected: ['Rejected', 'red', 'x'], needs_human: ['Needs human', 'violet', 'bang'],
  escalated: ['Escalated', 'violet', 'up'], merged: ['Merged', 'ink', 'check', true], closed: ['Closed', 'neutral', 'slash'],
  finished: ['Finished', 'neutral', 'check'], errored: ['Errored', 'violet', 'bang'], cancelled: ['Cancelled', 'neutral', 'slash'],
  succeeded: ['Succeeded', 'green', 'check'], failed: ['Failed', 'red', 'x'], timed_out: ['Timed out', 'red', 'clock'],
  skipped: ['Skipped', 'neutral', 'dash'], queued: ['Queued', 'neutral', 'none', false, true],
  met: ['Met', 'green', 'check'], unmet: ['Unmet', 'red', 'x'], unknown: ['Unknown', 'neutral', 'q'], pending: ['Pending', 'neutral', 'none', false, true],
  blocker: ['Blocker', 'red', 'bang', true], major: ['Major', 'amber', 'bang'], minor: ['Minor', 'neutral', 'info'],
  human_required: ['Human required', 'violet', 'bang'], alert: ['Open', 'violet', 'bang'], resolved: ['Resolved', 'neutral', 'check'],
  info: ['Next step', 'neutral', 'info']
};
class Component extends DCLogic {
  renderVals() {
    const k = this.props.status || 'open';
    const [label, tone, icon, fill, dash] = S[k] || S.open;
    const mode = this.props.mode || 'pill';
    const [fg, bg] = TONE[tone];
    const half = icon === 'half';
    const pill = mode === 'pill';
    return {
      label: this.props.label || label, fg, bg: pill ? bg : 'transparent',
      pad: pill ? '0 7px 0 4px' : '0', h: pill ? '20px' : 'auto',
      showIcon: mode !== 'text', showLabel: mode !== 'icon', srOnly: mode === 'icon',
      cf: fill ? 'currentColor' : 'none', da: dash ? '2.1 2.1' : 'none',
      d: half ? 'M8 2.25a5.75 5.75 0 0 1 0 11.5z' : (P[icon] || ''),
      ps: half ? 'none' : (fill ? 'var(--bg)' : 'currentColor'), pf: half ? 'currentColor' : 'none'
    };
  }
}
</script>
</body>
</html>
