version: 1
steps:
  - name: build
    image: golang:1.27
    run: go build ./...
    cache: [/go/pkg/mod, /root/.cache/go-build]
  - name: test
    image: golang:1.27
    run: go test ./...
    cache: [/go/pkg/mod, /root/.cache/go-build]
  - name: lint
    image: golang:1.27
    run: "go vet ./... && test -z \"$(gofmt -l .)\""
    cache: [/go/pkg/mod, /root/.cache/go-build]
  - name: web
    image: node:24-alpine
    run: "cd web && npm ci --no-audit --no-fund && npm test -- --reporter=dot && npm run build"
    cache: [/root/.npm]
  - name: validate
    image: plumbix-reference-validator:dev
    validator: true
    needs: [build, test, lint, web]
  - name: ai-review
    validator: true
    external: true
    needs: [build, test, lint, web]
    timeout: 30m0s
  - name: ai-grok
    image: plumbix-ai-validator:dev
    validator: true
    needs: [build, test, lint, web]
    reviewer: grok-4
    advisory: true
    effort: medium
stages:
  checks: [build, test, lint, web]
