openapi: 3.1.0
info:
  title: Plumbix API
  version: "1"
  description: >
    Public HTTP API of a Plumbix server. Version 1 has no authentication and
    the server listens on loopback addresses only.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:6400/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that the server is running.
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /pipelines/check:
    post:
      operationId: checkPipeline
      summary: Validate a pipeline file without running it.
      description: >
        The request body is the pipeline YAML. An invalid pipeline is a normal
        result with valid set to false, not an HTTP error. The file format is
        defined in pipeline.schema.json.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 1048576
      responses:
        "200":
          description: The check ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineCheck"
        "413":
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    PipelineCheck:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid:
          type: boolean
        order:
          description: Step names in dependency order. Present when valid.
          type: array
          items:
            type: string
        errors:
          description: Every problem found. Present when not valid.
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
    PipelineProblem:
      type: object
      additionalProperties: false
      required: [path, line, message]
      properties:
        path:
          description: Location in the file, such as steps[1].needs[0]. Empty for whole-file problems.
          type: string
        line:
          description: Line number, or 0 when unknown.
          type: integer
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Error:
      description: Error shape shared by every endpoint.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
