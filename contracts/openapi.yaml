openapi: 3.1.0
info:
  title: Plumbix API
  version: "1"
  description: >
    Public HTTP API of a Plumbix server. The server listens on loopback
    addresses only. Every operation except getHealth needs the bearer token
    from <data_dir>/api-token, which the server creates on first start.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:6400/api/v1
security:
  - bearerToken: []
  - cookieSession: []
paths:
  /settings:
    get:
      operationId: getSettings
      summary: Operator settings and which secrets are set.
      description: Secret values are never returned, only whether a key is set and when it was last set through Plumbix.
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateSettings
      summary: Set the global review guidance or a family's default reviewer profile.
      description: Fields left out are unchanged; an empty guidance clears it. Guidance is handed to every validator as operator instructions. Naming a reviewer profile makes it the default of its family (api profiles judge container validator steps that name none, the claude-code profile answers external steps that name none).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                guidance:
                  type: string
                  maxLength: 4000
                default_reviewer:
                  description: The name of an existing reviewer profile, which becomes its family's default.
                  type: string
                  maxLength: 32
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/reviewers/{name}:
    put:
      operationId: putReviewerProfile
      summary: Create or replace a reviewer profile.
      description: >
        A reviewer profile (WU-028, A29) is a named model configuration a validator step is bound to with
        reviewer: <name>; the default of its family applies to steps that name none. Kinds anthropic and
        openai are API profiles: a container AI validator receives the provider, base URL, model and key,
        billed per token by the vendor. Kind claude-code is the external loop (plumbix review --watch) on a
        person's machine, on that machine's Claude subscription: an external step's brief carries its tool
        policy and model, and it has no key or base URL. Kind claude-code-image (WU-035, A33) is Claude Code
        inside the pipeline, an API-family profile for the plumbix-claude-code-validator image: its key secret
        holds a token from claude setup-token or an API key, it has tools, no base URL and no effort. The key
        of an API profile is set through the secrets endpoint under the profile's key_secret and never
        travels here.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9-]{0,31}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [anthropic, openai, claude-code, claude-code-image]
                base_url:
                  description: For openai, the chat-completions base such as https://api.openai.com/v1.
                  type: string
                  maxLength: 200
                model:
                  description: Empty means the kind's default.
                  type: string
                  maxLength: 81
                tools:
                  description: Whether a reviewer with tools (Claude Code) may run commands; read-only by default.
                  type: string
                  enum: [read-only, full]
                effort:
                  description: For API kinds, the model's reasoning effort; empty leaves the vendor's default (WU-034).
                  type: string
                  enum: ["", low, medium, high]
                key_secret:
                  description: The secret holding the key; defaults to PLUMBIX_REVIEWER_<NAME>_KEY.
                  type: string
                  maxLength: 128
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteReviewerProfile
      summary: Remove a reviewer profile; the default is cleared if it was it.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed. Pipeline steps still naming it fail until they are changed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /images:
    get:
      operationId: listImages
      summary: The container images the registered pipelines run, with what the server knows about each.
      description: >
        Every image named by a registered repository's pipeline at its default branch, plus the two
        images Plumbix ships (WU-032, A32): whether it exists locally, when it was created, its size and
        digest, which repositories and steps use it, and for shipped images the version label of the
        local build against the running server.
      responses:
        "200":
          description: The images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Images"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /images/{name}/build:
    post:
      operationId: buildImage
      summary: Build one of the images Plumbix ships, from the sources embedded in the server, or an own image from its Dockerfile.
      description: >
        Starts the build and answers at once; follow it with GET /images/builds/{id}. One build runs at
        a time. The build runs on the server's Docker daemon outside the step sandbox, so it is a
        person's act: this route is not offered by the MCP server.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The build was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageBuild"
        "400":
          description: Not an image Plumbix ships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A build is already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /images/own/{name}:
    put:
      operationId: putOwnImage
      summary: Create or replace an own image's Dockerfile (WU-033).
      description: >
        The Dockerfile is stored under the server's data directory and is the image's whole build
        context; the image is built from it with POST /images/{name}/build and tagged <name>:latest,
        which a pipeline's bare `image: <name>` resolves to. A person's act, not offered by the MCP server.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dockerfile]
              properties:
                dockerfile:
                  type: string
                  maxLength: 65536
      responses:
        "200":
          description: The images after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Images"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteOwnImage
      summary: Remove an own image's definition; a built image stays until Docker prunes it.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed. Pipeline steps still naming it fail to pull once Docker forgets it.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /images/builds/{id}:
    get:
      operationId: getImageBuild
      summary: One image build with its log so far.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageBuild"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /reviews/next:
    get:
      operationId: claimReview
      summary: Claim the next review waiting for an external reviewer.
      description: >
        For external validator steps (WU-023). Hands the oldest waiting,
        unexpired review to the named reviewer with a fresh token, emitting
        review.claimed; a reviewer never receives a change it submitted
        itself. wait long-polls up to that many seconds (at most 55) before
        answering 204 when nothing is waiting. The brief carries the AI
        validator's prompt and schema, the commits, the repository URL and
        the operator's tool policy and model.
      parameters:
        - name: reviewer
          in: query
          required: true
          description: A name for the step log and for the rule that nobody reviews their own change.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: repo_id
          in: query
          required: false
          description: Only reviews of this repository.
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Seconds to wait for a review before answering 204; 0 answers at once. Values above 55 are clamped to 55, the most one request waits.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The claimed review's brief, with the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewBrief"
        "204":
          description: Nothing is waiting.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reviewers:
    get:
      operationId: listReviewers
      summary: The external reviewers the server has heard from since it started.
      description: >
        Every poll of GET /reviews/next is a heartbeat. The list is kept in
        memory, most recently seen first, with each reviewer's repository
        filter; a restarted server has heard from nobody until the next poll.
        When an external review is published and nobody who could take it
        polled within two minutes, an alert of kind no_reviewer is raised for
        the repository and resolved by the next such poll.
      responses:
        "200":
          description: The reviewers seen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /reviews/{id}/log:
    post:
      operationId: appendReviewLog
      summary: Append one progress line from the reviewer to the waiting step's log.
      description: >
        For the reviewer holding the claim: the line is written to the external
        step's log prefixed "reviewer:", so the change page shows what the
        reviewer is doing while it works. Lines are folded to one line,
        bounded to 300 characters and 300 per review, and no more than one
        every 500 ms; beyond that the answer is 429.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, line]
              properties:
                token:
                  type: string
                  minLength: 1
                line:
                  type: string
                  minLength: 1
                  maxLength: 300
      responses:
        "204":
          description: The line was appended.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The review is not claimed with this token, or was answered or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many lines, or too fast.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reviews/{id}/verdict:
    post:
      operationId: postReviewVerdict
      summary: Post the verdict of a claimed review.
      description: >
        Accepted once, with the token that came with the brief, while the
        review has not expired. The verdict passes the same checks as a
        verdict file from a container validator; the waiting step then
        succeeds with it and the run continues.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, verdict]
              properties:
                token:
                  type: string
                  minLength: 1
                verdict:
                  description: verdict.json as the validator contract defines it (ARCHITECTURE 4.3).
                  type: object
      responses:
        "200":
          description: The verdict was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAccepted"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The token is not the one handed out with the brief, or the review was already answered or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /settings/secrets/{key}:
    put:
      operationId: setSecret
      summary: Set a secret.
      description: >
        Writes the value into the server's secrets file (mode 0600) and uses it from now on: the next fetch,
        push and token check see it. The value is never logged or returned. Any key a pipeline step may name is
        accepted, not only the well-known ones.
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value:
                  type: string
                  minLength: 1
      responses:
        "204":
          description: Set.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: removeSecret
      summary: Remove a secret from the secrets file.
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "204":
          description: Removed, or was not set.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings/secrets/{key}/check:
    post:
      operationId: checkSecret
      summary: Check a git host token now.
      description: Runs the host's token check with the current value. Only for the host token keys.
      parameters:
        - $ref: "#/components/parameters/SecretKey"
      responses:
        "200":
          description: The check's result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretCheck"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /repos/inspect:
    post:
      operationId: inspectFolder
      summary: Read a local folder's git metadata before importing it.
      description: >
        WU-041, A35. The path must resolve, symlinks included, inside the server user's home directory; ~ stands
        for it. The folder must be a git working tree. Plumbix reads it through git only and changes nothing.
        The suggested host and URL come from the folder's origin remote (else its first remote): GitHub and Azure
        DevOps SSH remotes become their HTTPS form so a token applies. problem says why the remote cannot be
        registered as it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path]
              properties:
                path:
                  type: string
      responses:
        "200":
          description: The folder and the registration it suggests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoFolder"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /repos/publish:
    post:
      operationId: publishFolder
      summary: Create a repository online for a local folder with no remote and push the folder to it.
      description: >
        WU-042, A35. path must resolve inside the server user's home directory and be the top of a git working
        tree with commits and no remote. The repository is created through the host's API (GitHub under the
        token's account, or the organisation named in owner; Azure DevOps in the organisation owner and project)
        with token, or the host token when token is empty; the token is sent only in headers and never echoed.
        The folder then gains origin and every branch is pushed, never forced. Registering the repository is a
        separate POST /repos. Code create_failed means nothing was created or changed; push_failed means the
        repository exists online, and the message says so; the folder may or may not have gained origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [path, host, name]
              properties:
                path:
                  type: string
                host:
                  type: string
                  enum: [github, azuredevops]
                owner:
                  description: GitHub account or organisation (empty for the token's account), or Azure DevOps organisation.
                  type: string
                project:
                  description: Azure DevOps project.
                  type: string
                name:
                  type: string
                private:
                  description: GitHub visibility; Azure DevOps repositories follow their project.
                  type: boolean
                token:
                  description: A token for this repository; the host token when empty.
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: The repository created and the branches pushed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoPublished"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Code unavailable, the server has no host of that kind configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Codes create_failed and push_failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}/clone:
    post:
      operationId: cloneRepo
      summary: Clone a registered repository into a local folder.
      description: >
        WU-041, A35. dest must resolve inside the server user's home directory, under an existing parent, and must
        not exist or be empty. The clone uses the repository's own token or the host token through git's askpass,
        never the URL or the arguments. Code clone_failed carries git's message when the remote refuses.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [dest]
              properties:
                dest:
                  type: string
      responses:
        "200":
          description: Where the clone is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoClone"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Code clone_failed, the remote refused or could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}:
    delete:
      operationId: removeRepo
      summary: Retire a repository at a person's request.
      description: >
        Refused with repo_busy while a change of the repository is open or running. Afterwards the repository
        is gone from every listing and lookup, its bare mirror is deleted from the data directory, and its
        changes, runs, merges and events stay for the record, though their diffs and refreshes go with the mirror;
        repo.removed names who asked (WU-065). A running triggered or branch run of the repository refuses the
        removal too.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [by]
              properties:
                by:
                  description: Who removes the repository, as Plumbix should record it.
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Code repo_busy, a change of the repository is open or running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}/settings:
    get:
      operationId: getRepoSettings
      summary: One repository's review guidance.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      responses:
        "200":
          description: The repository's settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateRepoSettings
      summary: Set one repository's review guidance (empty clears it), and whether Plumbix watches its pull requests and who merges them; a field left out stays as it is.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoSettings"
      responses:
        "200":
          description: The repository's settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoSettings"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/pipeline:
    get:
      operationId: getRepoPipeline
      summary: The repository's pipeline file at a branch head, parsed for the editor.
      description: >
        Fetches the repository and reads .plumbix/pipeline.yaml at the head of
        the branch (default: the first protected branch). A missing or invalid
        file is still a 200: pipeline is null and problems says why. last_run
        is the newest finished run on that branch, for step durations.
      parameters:
        - $ref: "#/components/parameters/RepoID"
        - name: branch
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The pipeline file and its parsed model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineFile"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown repository or branch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}/pipelines:
    get:
      operationId: listTriggeredPipelines
      summary: The triggered pipelines under .plumbix/pipelines/ at a branch head (WU-045).
      description: >
        Fetches the repository and reads every .plumbix/pipelines/<name>.yaml at
        the head of the branch (default: the first protected branch). A file
        that does not parse is listed with on null and its problems. A pipeline
        that is disabled, or holds a disabled step, never runs; blockers counts
        what disables it per reason.
      parameters:
        - $ref: "#/components/parameters/RepoID"
        - name: branch
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The triggered pipelines, sorted by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriggeredPipelines"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/import:
    get:
      operationId: previewPipelineImport
      summary: What importing a CI system's pipelines at a branch head would write (WU-046).
      description: >
        Reads the YAML files at the head of the branch (default: the first
        protected branch), finds the source system's pipelines and converts
        each into a triggered pipeline under .plumbix/pipelines/. Every job is
        kept; what Plumbix cannot run yet is disabled with a reason, and a
        pipeline with any disabled step is disabled. files is the plan over
        the imported pipelines already on the branch (WU-048), what POST
        /repos/{id}/import/changes would commit. Nothing is written.
      parameters:
        - $ref: "#/components/parameters/RepoID"
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [azure]
        - name: branch
          in: query
          schema:
            type: string
      responses:
        "200":
          description: The converted pipelines and the files that could not be converted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/import/changes:
    post:
      operationId: proposePipelineImport
      summary: Import or re-check a CI system's pipelines as a change (WU-048).
      description: >
        Plans the import at the head of the target branch (default: the first
        protected branch) over the imported pipelines already there: new
        source pipelines are added; what the import wrote and nobody edited is
        replaced by the new conversion; steps and pipeline fields a person
        edited, and steps a person added, are kept; a gone source pipeline's
        file is removed when untouched. Every added, updated and removed file
        is committed in one commit on a new branch (default
        plumbix/import-<head>), pushed with the repository's credentials
        without forcing, and opened as a change whose intent lists the plan.
        Because it edits .plumbix/, the change ends in needs_human.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source]
              properties:
                source:
                  type: string
                  enum: [azure]
                target_branch:
                  type: string
                branch:
                  description: The new branch; default plumbix/import-<first 12 characters of the target head>.
                  type: string
                title:
                  description: Default "Import pipelines from <system>", or "Re-check pipelines imported from <system>" when any file was imported before.
                  type: string
                  maxLength: 200
      responses:
        "201":
          description: The change that was opened, and the plan it commits.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportChange"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Codes up_to_date (the import would write nothing), branch_exists (the host already has the branch) and push_denied (the host refused the credentials; set a token for the repository).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}/pipelines/{name}/runs:
    post:
      operationId: runTriggeredPipeline
      summary: Run a triggered pipeline by hand at a branch head (WU-045).
      description: >
        The pipeline needs on.manual: true and must not be disabled. The run
        is pinned to the branch head (default: the first protected branch) and
        recorded with its pipeline name; a newer run of the same pipeline on
        the same branch supersedes it.
      parameters:
        - $ref: "#/components/parameters/RepoID"
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                branch:
                  type: string
      responses:
        "201":
          description: The run that started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown repository, branch or pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Codes not_manual (no on.manual), pipeline_disabled (the pipeline or a step is disabled) and pipeline_invalid (the file does not parse; details.problems lists why).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}/pipeline/changes:
    post:
      operationId: proposePipeline
      summary: Commit an edited pipeline file on a new branch and open a change for it.
      description: >
        Plumbix parses the content, commits it as the only change on the
        target branch's head (default: the first protected branch), pushes the
        new branch with the repository's credentials, never forcing, and
        submits a change whose validation runs with the pipeline on the
        target branch. Because the change edits .plumbix/, it ends in
        needs_human: a person approves every pipeline change.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineProposal"
      responses:
        "201":
          description: The change that was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Codes branch_exists (the host already has the branch) and push_denied (the host refused the credentials; set a token for the repository).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos/{id}/token:
    put:
      operationId: setRepoToken
      summary: Give one repository its own token.
      description: >
        A fine-grained GitHub token covers only the repositories chosen for it, so a repository may carry its own
        token; it wins over the host-wide one for that repository. Stored in the secrets file like any secret, never
        returned.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value:
                  type: string
                  minLength: 1
      responses:
        "204":
          description: Set.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeRepoToken
      summary: Remove a repository's own token; the host-wide one applies again.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      responses:
        "204":
          description: Removed, or was not set.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/token/check:
    post:
      operationId: checkRepoToken
      summary: Fetch the repository's branches with the credentials that apply to it now.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      responses:
        "200":
          description: The check's result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/github:
    get:
      operationId: getRepoGitHub
      summary: The repository's GitHub integration, read live.
      description: >
        For a GitHub repository: whether the configured App is installed on it (asked as the App), per
        protected branch whether the plumbix/gate check is required there, and how pull requests reach
        the server (webhook, polling or neither). The App's id and key are one per host and live in
        Settings; this report is the per-repository part (WU-061). Nothing is stored.
      parameters:
        - $ref: "#/components/parameters/RepoID"
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such repository, or a repository on another host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /criteria-sets:
    post:
      operationId: createCriteriaSet
      summary: Create a criteria set, acceptance criteria written with the specification.
      description: >
        A client such as Kai posts a task's acceptance criteria when the specification is settled (WU-066, A43).
        A change names the set (criteria_set on a submission) or a pull request does (a line "Acceptance criteria: cs_<id>"
        in its body), and takes the set's criteria frozen at that moment, with the set's id, owner and task recorded on
        the change. A set binds pipeline steps only, never a command, since any change may name it. Written only through
        the API token or a browser session; a pull request can name a set but never write one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriteriaSetInput"
      responses:
        "201":
          description: The set, with its id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriteriaSet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      operationId: listCriteriaSets
      summary: List criteria sets, newest first, those of one task when task is given.
      parameters:
        - name: task
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The sets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriteriaSetList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /criteria-sets/{id}:
    get:
      operationId: getCriteriaSet
      summary: Read one criteria set, with the changes that used it.
      parameters:
        - $ref: "#/components/parameters/CriteriaSetID"
      responses:
        "200":
          description: The set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriteriaSet"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateCriteriaSet
      summary: Replace a criteria set no change has used yet.
      description: Once a change took its criteria from the set, the set is frozen; a new set is a new id.
      parameters:
        - $ref: "#/components/parameters/CriteriaSetID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriteriaSetInput"
      responses:
        "200":
          description: The replaced set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CriteriaSet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Code criteria_set_used, the set was used by a change and is frozen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login-links:
    post:
      operationId: createLoginLink
      summary: Mint a one-time browser sign-in link.
      description: >
        Only the bearer token may call this; plumbix login does. The link opens the web app, which exchanges
        its token once with POST /sessions. Links expire after 10 minutes.
      security:
        - bearerToken: []
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sessions:
    post:
      operationId: exchangeLoginLink
      summary: Sign a browser in with a login link.
      description: >
        A browser request without credentials. It must carry the server's own Host and an Origin of
        http://<that host>. On success the response sets the plumbix_session cookie (HttpOnly, SameSite=Strict,
        30 days). A link works once: a second use is 401 link_used, after 10 minutes 401 link_expired, an unknown
        token 401 link_invalid.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Signed in; the cookie is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The link was used, expired or is unknown (codes link_used, link_expired, link_invalid), or the Host is not the server's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: revokeAllSessions
      summary: Sign every browser out.
      description: Only the bearer token may call this; plumbix logout does.
      security:
        - bearerToken: []
      responses:
        "200":
          description: How many sessions were ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Revoked"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /sessions/current:
    delete:
      operationId: signOut
      summary: Sign this browser out.
      security:
        - cookieSession: []
      responses:
        "204":
          description: The session ended and the cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /session:
    get:
      operationId: getSession
      summary: How the caller is signed in.
      responses:
        "200":
          description: Signed in, by cookie (with its expiry) or by token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      operationId: getHealth
      summary: Report that the server is running.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /hooks/github:
    post:
      operationId: githubWebhook
      summary: Receive a GitHub webhook delivery for a repository gated through pull requests (WU-054).
      description: >
        Deliveries of pull_request (opened, reopened, synchronize, closed, ready_for_review),
        pull_request_review (submitted) and check_suite or check_run (rerequested) feed the same
        intake the poller uses, so a webhook is optional: polling alone finds everything, later.
        Every delivery must carry GitHub's X-Hub-Signature-256 made with PLUMBIX_GITHUB_WEBHOOK_SECRET;
        there is no bearer token on this route. Without the secret set, the route answers 503.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: GitHub's delivery payload, as documented by GitHub.
      responses:
        "202":
          description: The delivery was acted on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "200":
          description: The delivery was valid but the gate has no use for this event or action (or it was a ping).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "401":
          description: The signature is missing or wrong.
        "404":
          description: No registered GitHub repository with pull_requests set has the delivery's repository URL.
        "503":
          description: PLUMBIX_GITHUB_WEBHOOK_SECRET is not set.
  /pipelines/check:
    post:
      operationId: checkPipeline
      summary: Validate a pipeline file without running it.
      description: >
        The request body is the pipeline YAML. An invalid pipeline is a normal
        result with valid set to false, not an HTTP error. The file format is
        defined in pipeline.schema.json.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 1048576
      responses:
        "200":
          description: The check ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos:
    post:
      operationId: registerRepo
      summary: Register a git repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoInput"
      responses:
        "201":
          description: The repo was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listRepos
      summary: List registered repos, oldest first.
      responses:
        "200":
          description: Every registered repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /changes:
    post:
      operationId: submitChange
      summary: Submit a change with its intent and acceptance criteria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeInput"
      responses:
        "201":
          description: The change was stored in state open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listChanges
      summary: List changes, oldest first.
      parameters:
        - name: repo_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ChangeState"
      responses:
        "200":
          description: Matching changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /changes/{id}:
    get:
      operationId: getChange
      summary: Read one change.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /changes/{id}/close:
    post:
      operationId: closeChange
      summary: Close a change without merging.
      description: Allowed unless the change is already merged or closed.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The closed change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is already merged or closed (invalid_state), or changed state meanwhile (conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/refresh:
    post:
      operationId: refreshChange
      summary: Bring the target branch into a branch Plumbix created, and validate again.
      description: >
        For changes whose source branch Plumbix created (plumbix_branch, the
        pipeline editor's changes). Plumbix merges the target's head into
        the branch with itself as author, pushes the merge commit under a
        lease on the old head (never forced), records change.refreshed and
        starts a new iteration; the change is running when this returns.
        A person asks for it, so it applies to sticky states too, and like
        every new run it ends a standing approval. Branches with a commit by
        anyone else are left alone: their authors bring the target in.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The change, now running its new iteration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            Codes invalid_state (final or running), not_plumbix_branch (the
            branch is not Plumbix's, or carries someone else's commit),
            already_current (the branch contains the target's head),
            merge_conflict (both sides changed the same lines; the message
            names the paths), push_rejected (the branch moved during the
            refresh) and push_denied (the host refused the credentials).
            Nothing was pushed in any of these cases.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/approve:
    post:
      operationId: approveChange
      summary: A person approves a needs_human or escalated change, with a reason and their name.
      description: >
        Records the reason and the validated head on the change, emits
        change.approved_by_person and the state change to approved, and lets
        the normal merge apply. A later push starts a new run, which ends the
        approval. Only needs_human and escalated changes; rejected is the
        validators' explicit no.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, by]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                by:
                  description: Who approves, as Plumbix should record it (WU-060). The API carries no identity of its own, so the client says.
                  type: string
                  minLength: 1
                  maxLength: 100
      responses:
        "200":
          description: The approved change, with human_approval set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is not needs_human or escalated, has no finished run (invalid_state), or changed state meanwhile (conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/merge:
    post:
      operationId: mergeChange
      summary: Merge an approved change.
      description: >
        Lands exactly the validated tree on the target branch with the repo's
        merge strategy and pushes it to the host. Refused when the source
        branch moved since validation (source_moved: the new commits need a
        verdict), when the target branch is not the commit validation assumed
        (target_moved: bring the target into the source and push), when the
        remote moved during the push (push_rejected), when the host's rules for
        the branch refused the update (push_refused: the message carries the
        rules), or when the host did not accept Plumbix's credentials for the
        push (push_denied: set a token for the repository). When the target
        requires the plumbix/gate check, the landing commit is first pushed to
        a holding ref and the gate is posted on it as a success, so the rule
        is satisfied by the same check run a pull request gets (WU-059). A
        refused merge changes nothing.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The merged change, with its merge record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Codes invalid_state (not approved, or a merge is in progress), source_moved, target_moved, push_rejected, push_refused (the host's rules refused the update; the message names them), push_denied, github_merges (the repository lets GitHub merge its pull requests; merge the pull request there and Plumbix records it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/validate:
    post:
      operationId: validateChange
      summary: Start a new validation iteration for a change.
      description: >
        Fetches the source branch, runs the pipeline and the validators, and
        moves the change to its outcome. A run still going for the change is
        cancelled. Submitting a change starts iteration 1 automatically.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is merged or closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/runs:
    get:
      operationId: listChangeRuns
      summary: List a change's runs by iteration.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The change's runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/runs:
    get:
      operationId: listRepoRuns
      summary: List a repo's runs, newest first.
      description: Includes plain runs started by pushes to branches without a change.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The repo's runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /runs/{id}:
    get:
      operationId: getRun
      summary: Read a run with its steps and combined result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /runs/{id}/steps/{step}/log:
    get:
      operationId: getStepLog
      summary: Read a step's log as plain text.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: step
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The log.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /changes/{id}/diff:
    get:
      operationId: getChangeDiff
      summary: The diff the validators judged.
      description: >
        base..head of the change's latest run that has a head. Files are sorted by path; renames are not
        detected (a rename is a delete and an add). With stat=true the hunks are left out. A diff larger than
        4 MiB comes back as stats only with truncated set.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
        - name: stat
          in: query
          description: true returns files and counts without hunks.
          schema:
            type: boolean
      responses:
        "200":
          description: The diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No run of the change has reached a commit yet (invalid_state).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /alerts:
    get:
      operationId: listAlerts
      summary: List alerts, newest first.
      description: Bypass commits on protected branches and host token warnings. Open alerts only unless include_resolved is set.
      parameters:
        - name: include_resolved
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      summary: Mark an alert as handled.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The resolved alert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /events:
    get:
      operationId: streamEvents
      summary: Stream events as Server-Sent Events.
      description: >
        Each frame carries the event's id as its id, the event type as its event name, and the event JSON
        (schema Event, defined in contracts/events.schema.json) as its data. The stream first replays recorded
        events after the Last-Event-ID header or the after parameter, then follows live. Ids increase and are
        never reused, so a client that reconnects with the last id it saw misses nothing and sees nothing twice.
        Events describe facts the other endpoints expose; those endpoints are the source of truth. An idle stream
        sends a comment line every 15 seconds. The stream ends when the server stops.
      parameters:
        - name: Last-Event-ID
          in: header
          description: Resume after this event id. Takes precedence over after.
          schema:
            type: integer
            minimum: 0
        - name: after
          in: query
          description: Resume after this event id; 0 or absent replays from the first recorded event.
          schema:
            type: integer
            minimum: 0
        - name: repo_id
          in: query
          description: Only events of this repo.
          schema:
            type: string
        - name: change_id
          in: query
          description: Only events of this change.
          schema:
            type: string
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: Frames of id, event and data lines; each data line is one Event.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: The 64-character hex token in <data_dir>/api-token.
    cookieSession:
      type: apiKey
      in: cookie
      name: plumbix_session
      description: >
        A browser session from POST /sessions. Cookie requests must carry the server's own Host, and
        state-changing ones an Origin of http://<that host>; otherwise 401 or 403.
  parameters:
    ChangeID:
      name: id
      in: path
      required: true
      schema:
        type: string
    RepoID:
      name: id
      in: path
      required: true
      schema:
        type: string

    CriteriaSetID:
      name: id
      in: path
      required: true
      schema:
        type: string
    SecretKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
  responses:
    InvalidRequest:
      description: The body is not valid JSON, has unknown fields, or breaks field rules. details.problems lists every problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The repo or change does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The repo is already registered, or another change is open on the same source branch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The body is larger than 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: A browser request whose Origin is not the server's own address.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The bearer token is missing or wrong, or the browser session is missing, expired, or sent to another Host.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ChangeState:
      type: string
      enum: [open, running, approved, fix_requested, rejected, needs_human, escalated, merged, closed]
    Branch:
      description: A branch name following git's ref rules.
      type: string
      minLength: 1
      maxLength: 255
    RepoInput:
      type: object
      additionalProperties: false
      required: [host, url]
      properties:
        host:
          type: string
          enum: [github, azuredevops, git]
        url:
          description: >
            GitHub: https://github.com/<owner>/<repo>.
            Azure DevOps: https://dev.azure.com/<org>/<project>/_git/<repo>
            or https://<org>.visualstudio.com/<project>/_git/<repo>.
            Plain git: an absolute path to a repository on this machine
            (preferably bare), file:///path, ssh://[user@]host[:port]/path or
            user@host:path. SSH uses the server user's own keys.
          type: string
        protected_branches:
          description: Defaults to ["main"].
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        pull_requests:
          description: Gate the repository's GitHub pull requests (WU-054). GitHub repositories only.
          type: boolean
        merger:
          description: plumbix or github. Defaults to github when pull_requests is set, plumbix otherwise.
          type: string
          enum: [plumbix, github]
        merge_strategy:
          type: string
          enum: [squash, merge, rebase]
          default: squash
    Repo:
      type: object
      additionalProperties: false
      required: [id, host, url, protected_branches, merge_strategy, created_at]
      properties:
        id:
          type: string
          pattern: "^r_[a-z2-7]{12}$"
        host:
          type: string
          enum: [github, azuredevops, git]
        url:
          type: string
        protected_branches:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Branch"
        merge_strategy:
          type: string
          enum: [squash, merge, rebase]
        pull_requests:
          description: Plumbix watches the repository's GitHub pull requests, opens a change per pull request and posts its verdicts as check runs (WU-054). GitHub only.
          type: boolean
        merger:
          description: Who lands a change. plumbix pushes the validated tree; github merges the pull request and Plumbix records it (a change without a pull request still merges through Plumbix). The server always sends it; it is optional here so repository objects recorded before WU-054 still validate.
          type: string
          enum: [plumbix, github]
        paused:
          description: Polling and pull-request intake are stopped for the repository (WU-065).
          type: boolean
        created_at:
          type: string
          format: date-time
    RepoList:
      type: object
      additionalProperties: false
      required: [repos]
      properties:
        repos:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
    Check:
      description: How the deterministic validator proves a criterion. Exactly one of steps or command.
      type: object
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        command:
          type: string
          minLength: 1
          maxLength: 2000
      oneOf:
        - required: [steps]
        - required: [command]
    Criterion:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          pattern: "^AC-[1-9][0-9]*$"
        text:
          type: string
          minLength: 1
          maxLength: 2000
        check:
          $ref: "#/components/schemas/Check"
        note:
          description: >-
            Why a pull request's item was not bound to the steps it named (WU-062), such as an unknown step or a
            command, which a pull request cannot run. Never set on an API submission.
          type: string
    CriteriaSetInput:
      description: Acceptance criteria written with the specification (WU-066). A set binds pipeline steps only; a command is refused.
      type: object
      additionalProperties: false
      required: [task, owner, criteria]
      properties:
        task:
          description: The specification the criteria belong to, as an opaque reference such as kai:<project>/<ref>.
          type: string
          minLength: 1
          maxLength: 200
        title:
          description: The specification's own title, as the tool wrote it.
          type: string
          maxLength: 2000
        owner:
          description: The person the criteria belong to, as the client knows them.
          type: string
          minLength: 1
          maxLength: 100
        source:
          $ref: "#/components/schemas/CriteriaSource"
        criteria:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CriterionInput"
    CriteriaSource:
      description: The tool a criteria set came from.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
        project:
          type: string
        ref:
          type: string
    CriteriaSet:
      type: object
      additionalProperties: false
      required: [id, task, owner, criteria, used_by, frozen, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^cs_[a-z0-9]+$"
        task:
          type: string
        title:
          type: string
        owner:
          type: string
        source:
          $ref: "#/components/schemas/CriteriaSource"
        criteria:
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
        used_by:
          description: The changes that currently take their criteria from the set.
          type: array
          items:
            type: string
        frozen:
          description: Set the first time a change takes its criteria from the set and never cleared; a frozen set cannot be edited.
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CriteriaSetList:
      type: object
      additionalProperties: false
      required: [criteria_sets]
      properties:
        criteria_sets:
          type: array
          items:
            $ref: "#/components/schemas/CriteriaSet"
    CriterionInput:
      description: Like Criterion, but id is optional. Missing ids get the smallest unused AC-<n>.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        id:
          type: string
          pattern: "^AC-[1-9][0-9]*$"
        text:
          type: string
          minLength: 1
          maxLength: 2000
        check:
          $ref: "#/components/schemas/Check"
    ChangeInput:
      type: object
      additionalProperties: false
      required: [repo_id, source_branch, target_branch, title, intent]
      properties:
        repo_id:
          type: string
        criteria_set:
          description: >-
            A criteria set to take the criteria from (WU-066); acceptance_criteria may then be left out and is not
            used. Without it, acceptance_criteria needs at least one criterion.
          type: string
          pattern: "^cs_[a-z0-9]{6,32}$"
        source_branch:
          $ref: "#/components/schemas/Branch"
        target_branch:
          $ref: "#/components/schemas/Branch"
        title:
          type: string
          minLength: 1
          maxLength: 200
        intent:
          type: string
          minLength: 1
          maxLength: 20000
        acceptance_criteria:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CriterionInput"
        constraints:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2000
        submitted_by:
          type: string
          maxLength: 100
    Change:
      type: object
      additionalProperties: false
      required: [id, repo_id, source_branch, target_branch, title, intent, acceptance_criteria, constraints, state, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^c_[a-z2-7]{12}$"
        repo_id:
          type: string
        source_branch:
          $ref: "#/components/schemas/Branch"
        target_branch:
          $ref: "#/components/schemas/Branch"
        title:
          type: string
        intent:
          type: string
        acceptance_criteria:
          description: >-
            Empty only for a change opened from a pull request that stated no criteria (WU-054); a submission
            needs at least one. A pull request's item ending in "(check: build, test)" is bound to those pipeline
            steps as check.steps (WU-062); a name that is not a step of the pipeline at the head leaves the item
            text, with a note.
          type: array
          items:
            $ref: "#/components/schemas/Criterion"
        constraints:
          type: array
          items:
            type: string
        submitted_by:
          type: string
        criteria_set:
          description: >-
            The criteria set the change took its criteria from, frozen at submission (WU-066), or the set it named
            but could not use, with the problem; absent when the change stated its own criteria.
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id:
              type: string
            owner:
              type: string
            task:
              type: string
            problem:
              type: string
        pull_request:
          description: The GitHub pull request the change mirrors (WU-054).
          type: object
          additionalProperties: false
          required: [number, url]
          properties:
            number:
              type: integer
              minimum: 1
            url:
              type: string
        state:
          $ref: "#/components/schemas/ChangeState"
        merge:
          $ref: "#/components/schemas/Merge"
        source_head:
          description: The source branch's head as the poller last saw it; differs from the last run's head when commits arrived since the verdict.
          type: string
        plumbix_branch:
          description: True when Plumbix created the source branch (a pipeline editor change); such a change can be refreshed from its target with POST /changes/{id}/refresh.
          type: boolean
        human_approval:
          description: Set while a person's approval stands; a new run clears it.
          type: object
          additionalProperties: false
          required: [reason, head, at]
          properties:
            reason:
              type: string
            head:
              description: The validated commit the person approved.
              type: string
            by:
              description: The person, as the surface knew them (WU-060), the name given to the Approve action or the GitHub login of the approving review. Absent on approvals recorded before it.
              type: string
            source:
              description: Where the approval came from; plumbix is the Approve action on the API, CLI, web or MCP tool.
              type: string
              enum: [plumbix, github_review]
            at:
              type: string
              format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChangeList:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
    Merge:
      description: How a change landed on its target branch.
      type: object
      additionalProperties: false
      required: [commit, previous, strategy, run_id, merged_at]
      properties:
        commit:
          description: The commit at the target's head after the merge.
          type: string
        previous:
          description: The target's head before the merge.
          type: string
        strategy:
          description: squash, merge or rebase for Plumbix's own merges; github when GitHub merged the pull request and Plumbix recorded it (WU-054).
          type: string
          enum: [squash, merge, rebase, github]
        run_id:
          description: The approved run that was merged; for a GitHub merge the latest run, empty when none had started.
          type: string
        merged_by:
          description: The GitHub login that merged the pull request; absent for Plumbix's own merges. With auto_merge, the login that requested auto-merge.
          type: string
        auto_merge:
          description: GitHub merged on merged_by's behalf once the gate was green (auto-merge, WU-063). Absent or false for a merge a person pressed and for Plumbix's own merges.
          type: boolean
        merged_at:
          type: string
          format: date-time
    Alert:
      type: object
      additionalProperties: false
      required: [id, kind, key, message, created_at]
      properties:
        id:
          type: string
          pattern: "^al_[a-z2-7]{12}$"
        kind:
          type: string
          enum: [bypass_commit, token_expiry, no_reviewer, pipeline_unapproved, gate_bypassed]
        key:
          description: Identifies the alert's subject; one open alert per kind and key.
          type: string
        repo_id:
          type: string
        message:
          type: string
        details:
          description: "bypass_commit: branch, head, count, commits[{sha, author, email, time, subject}]. token_expiry: host, expires. no_reviewer: change_id, run_id, review_id, step. pipeline_unapproved: file, branch, commit for a run that got no secrets, or change_id, branch when a merge could not record its pipeline files. gate_bypassed: number, url, merged_by, commit, change_id, state (the change's state when GitHub merged), reasons (not_passed, not_required)."
          type: object
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
    AlertList:
      type: object
      additionalProperties: false
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/Alert"
    Diff:
      type: object
      additionalProperties: false
      required: [base, head, additions, deletions, truncated, files]
      properties:
        base:
          type: string
        head:
          type: string
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        truncated:
          description: True when the diff was too large to parse; files then carry counts only.
          type: boolean
        files:
          type: array
          items:
            $ref: "#/components/schemas/DiffFile"
    DiffFile:
      type: object
      additionalProperties: false
      required: [path, status, binary, additions, deletions]
      properties:
        path:
          type: string
        status:
          type: string
          enum: [added, modified, deleted]
        binary:
          type: boolean
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/DiffHunk"
    DiffHunk:
      type: object
      additionalProperties: false
      required: [old_start, old_lines, new_start, new_lines, header, lines]
      properties:
        old_start:
          type: integer
          minimum: 0
        old_lines:
          type: integer
          minimum: 0
        new_start:
          type: integer
          minimum: 0
        new_lines:
          type: integer
          minimum: 0
        header:
          description: The text after the hunk range, usually the enclosing function.
          type: string
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type:
                type: string
                enum: [context, add, del]
              old:
                description: Line number on the old side; absent for added lines.
                type: integer
                minimum: 1
              new:
                description: Line number on the new side; absent for deleted lines.
                type: integer
                minimum: 1
              text:
                type: string
    ReviewBrief:
      description: >
        An external validator step waiting for a verdict (WU-023), as handed to
        the reviewer who claimed it. prompt and schema are the AI validator's
        own, so a reviewer needs no knowledge of Plumbix's rules; the verdict
        is posted back with the token.
      type: object
      additionalProperties: false
      required: [id, run_id, change_id, repo_id, repo_url, step, iteration, head, base, token, expires_at, tools, prompt, schema, criteria]
      properties:
        id:
          type: string
        run_id:
          type: string
        change_id:
          type: string
        repo_id:
          type: string
        repo_url:
          description: Where to fetch head from, with the reviewer's own git access.
          type: string
        step:
          type: string
        iteration:
          type: integer
        head:
          type: string
        base:
          type: string
        token:
          description: Minted for this claim; POST /reviews/{id}/verdict needs it. Shown once.
          type: string
        expires_at:
          description: When the step times out; a verdict after it is refused.
          type: string
          format: date-time
        tools:
          description: The operator's policy for the reviewer's tools.
          type: string
          enum: [read-only, full]
        model:
          description: The operator's model, if one is set.
          type: string
        reviewer:
          description: The reviewer profile whose tools and model apply, when one does (WU-028).
          type: string
        prompt:
          type: object
          additionalProperties: false
          required: [system, user]
          properties:
            system:
              type: string
            user:
              type: string
        schema:
          description: JSON schema of the verdict the reviewer must produce.
          type: object
        criteria:
          description: The criterion ids a verdict may name.
          type: array
          items:
            type: string
    ReviewerList:
      type: object
      additionalProperties: false
      required: [reviewers]
      properties:
        reviewers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, last_seen]
            properties:
              name:
                type: string
              repo_id:
                description: The reviewer's repository filter, when it polls for one repository only.
                type: string
              last_seen:
                type: string
                format: date-time
    ReviewAccepted:
      type: object
      additionalProperties: false
      required: [status, review_id]
      properties:
        status:
          type: string
          enum: [accepted]
        review_id:
          type: string
    Images:
      type: object
      additionalProperties: false
      required: [images, version]
      properties:
        version:
          description: The running server's version, which shipped images are compared with.
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
    Image:
      type: object
      additionalProperties: false
      required: [ref, present, shipped, own, status, used_by]
      properties:
        ref:
          description: The image as pipelines name it, such as golang:1.27 or plumbix-ai-validator:dev; a bare name is shown as name:latest.
          type: string
        own:
          description: Defined by a Dockerfile on the Images page (WU-033).
          type: boolean
        dockerfile:
          description: The own image's Dockerfile.
          type: string
        present:
          type: boolean
        created:
          type: string
          format: date-time
        size_bytes:
          type: integer
        digest:
          type: string
        shipped:
          description: One of the images Plumbix ships and can rebuild.
          type: boolean
        purpose:
          type: string
        version:
          description: For a shipped image, the server version that built it (the org.plumbix.version label).
          type: string
        status:
          description: missing, present (third-party), current, stale (built by another server version, or from an older Dockerfile) or unlabelled (built outside Plumbix).
          type: string
          enum: [missing, present, current, stale, unlabelled]
        used_by:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [repo_id, repo, step, validator]
            properties:
              repo_id:
                type: string
              repo:
                type: string
              step:
                type: string
              validator:
                type: boolean
              pipeline:
                description: The triggered pipeline the step is in (WU-045); absent for the change pipeline.
                type: string
    ImageBuild:
      type: object
      additionalProperties: false
      required: [id, image, status, started_at, log]
      properties:
        id:
          type: string
        image:
          type: string
        status:
          type: string
          enum: [running, succeeded, failed]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: string
        log:
          type: string
    Settings:
      type: object
      additionalProperties: false
      required: [guidance, defaults, reviewers, secrets]
      properties:
        guidance:
          description: Global operator guidance for validators.
          type: string
        defaults:
          description: Each family's default profile name; empty when the family has none.
          type: object
          additionalProperties: false
          required: [api, external]
          properties:
            api:
              type: string
            external:
              type: string
        reviewers:
          type: array
          items:
            $ref: "#/components/schemas/ReviewerProfile"
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/SecretStatus"
    RepoFolder:
      type: object
      additionalProperties: false
      required: [path, remote, default_branch, has_pipeline, host, url, problem]
      properties:
        path:
          description: The folder, resolved.
          type: string
        remote:
          description: The remote's URL as the folder has it; empty without one.
          type: string
        default_branch:
          type: string
        has_pipeline:
          description: Whether .plumbix/pipeline.yaml is in the folder's HEAD.
          type: boolean
        host:
          description: The host to register with; empty when problem is set.
          type: string
          enum: ["", github, azuredevops, git]
        url:
          description: The URL to register; empty when problem is set.
          type: string
        problem:
          type: string
    RepoPublished:
      type: object
      additionalProperties: false
      required: [url, host, default_branch, pushed]
      properties:
        url:
          description: The new repository's HTTPS URL, to register.
          type: string
        host:
          type: string
          enum: [github, azuredevops]
        default_branch:
          type: string
        pushed:
          type: array
          items:
            type: string
    RepoClone:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path:
          type: string
    ReviewerProfile:
      type: object
      additionalProperties: false
      required: [name, kind, family, base_url, model, tools, effort, key_secret, updated_at, key_set, default]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [anthropic, openai, claude-code, claude-code-image]
        family:
          description: api profiles judge from the container validator; the external one answers external steps.
          type: string
          enum: [api, external]
        base_url:
          type: string
        model:
          type: string
        tools:
          type: string
          enum: [read-only, full]
        effort:
          description: The reasoning effort of an API kind, or empty for the vendor's default.
          type: string
          enum: ["", low, medium, high]
        key_secret:
          description: The secret holding the key; set through the secrets endpoint.
          type: string
        updated_at:
          type: string
          format: date-time
        key_set:
          description: Whether the key secret currently has a value.
          type: boolean
        default:
          description: Whether this is its family's default.
          type: boolean
    SecretStatus:
      type: object
      additionalProperties: false
      required: [key, set, known, purpose]
      properties:
        key:
          type: string
        set:
          type: boolean
        known:
          description: True for the keys Plumbix itself reads.
          type: boolean
        purpose:
          type: string
        host:
          description: The git host whose token this is, when it is one.
          type: string
        updated_at:
          description: When the secret was last set through Plumbix; absent if never, or set by hand.
          type: string
          format: date-time
    SecretCheck:
      type: object
      additionalProperties: false
      required: [ok, message]
      properties:
        ok:
          type: boolean
        expires_at:
          type: string
          format: date-time
        message:
          type: string
    GitHubReport:
      type: object
      description: The per-repository GitHub facts behind the gate (WU-061), read live.
      required: [app, gate, intake]
      additionalProperties: false
      properties:
        app:
          type: object
          required: [configured, installed, message]
          additionalProperties: false
          properties:
            configured:
              type: boolean
              description: Whether a GitHub App is configured in Settings at all.
            slug:
              type: string
              description: The App's name on GitHub, when the configured App answers.
            installed:
              type: boolean
              description: Whether the App is installed on this repository; only an installed App can post check runs.
            install_url:
              type: string
              description: Where to install the App, when it is configured.
            message:
              type: string
        gate:
          type: array
          description: One entry per protected branch.
          items:
            type: object
            required: [branch, required, known, message]
            additionalProperties: false
            properties:
              branch:
                type: string
              required:
                type: boolean
                description: Whether plumbix/gate is a required status check on the branch.
              known:
                type: boolean
                description: False when GitHub would not say (the read needs administration read).
              message:
                type: string
        intake:
          type: object
          required: [mode, webhook_secret_set, message]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [webhook, polling, none]
            webhook_secret_set:
              type: boolean
            last_delivery_at:
              type: string
              format: date-time
              description: When a signed webhook delivery for this repository last arrived since the server started.
            poll_interval:
              type: string
              description: The poller's interval, when polling is on.
            message:
              type: string
    RepoSettings:
      description: A repository's own settings. A response carries every field; a request may leave fields out, and each one left out stays as it is.
      type: object
      additionalProperties: false
      properties:
        guidance:
          type: string
          maxLength: 4000
        token_set:
          description: Whether the repository has its own token, which wins over the host-wide one for it.
          type: boolean
        token_updated_at:
          type: string
          format: date-time
        pull_requests:
          description: Whether Plumbix watches the repository's GitHub pull requests and gates them with check runs (WU-054). Settable after registration (WU-055), GitHub only.
          type: boolean
        merger:
          description: Who lands changes. Left out of a request it stays as it is; empty in a request it takes the default for pull_requests (github with it, plumbix without). A response always names one.
          type: string
          enum: [plumbix, github, ""]
        merge_strategy:
          description: How Plumbix's own merges land (squash, merge or rebase); GitHub's merges of pull requests are not affected. Settable after registration (WU-064).
          type: string
          enum: [squash, merge, rebase]
        paused:
          description: Stops polling and pull-request intake for the repository (WU-065); changes submitted through the API still run and merge.
          type: boolean
    LoginLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    SessionStatus:
      type: object
      additionalProperties: false
      required: [status, via]
      properties:
        status:
          type: string
          enum: [signed_in]
        via:
          type: string
          enum: [cookie, token]
        expires_at:
          description: When the browser session ends; absent for the token.
          type: string
          format: date-time
    Revoked:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: integer
          minimum: 0
    Event:
      description: One event on the stream. The full schema, with every payload, is contracts/events.schema.json.
      $ref: "https://github.com/eduard-alloy/plumbix/blob/main/contracts/events.schema.json"
    RunStep:
      type: object
      additionalProperties: false
      required: [name, validator, status, exit_code, duration_ms]
      properties:
        name:
          type: string
        validator:
          type: boolean
        advisory:
          description: A validator whose verdict was recorded but not counted (WU-030).
          type: boolean
        status:
          type: string
          enum: [succeeded, failed, timed_out, errored, skipped, cancelled]
        exit_code:
          type: integer
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: string
        attempts:
          description: How many times the step ran; present when above one (retries).
          type: integer
          minimum: 1
        allowed_failure:
          description: The failure was tolerated by the step's allow_failure.
          type: boolean
        reason:
          description: Why a skipped step did not run.
          type: string
          enum: [needs, paths]
        stage:
          description: The pipeline stage the step belongs to.
          type: string
    Assessment:
      type: object
      additionalProperties: false
      required: [validator, status, reason]
      properties:
        advisory:
          description: From an advisory validator; shown, not merged into the criterion's status (WU-030).
          type: boolean
        validator:
          type: string
        status:
          type: string
          enum: [met, unmet, unknown]
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
    ValidationResult:
      description: The combined outcome of an iteration's validators.
      type: object
      additionalProperties: false
      required: [state, criteria, findings, risks, reasons, validators]
      properties:
        state:
          $ref: "#/components/schemas/ChangeState"
        validators:
          description: What each validator decided, in pipeline order. A validator that asked for fixes still ran fine; a missing outcome means it produced no verdict and error says why.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name:
                type: string
              advisory:
                description: Recorded, never counted (WU-030).
                type: boolean
              outcome:
                type: string
                enum: [approve, fix, reject]
              summary:
                type: string
              error:
                type: string
              usage:
                $ref: "#/components/schemas/Usage"
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, text, status, assessments]
            properties:
              id:
                type: string
              text:
                type: string
              status:
                type: string
                enum: [met, unmet, unknown]
              assessments:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [validator, severity, message]
            properties:
              validator:
                type: string
              advisory:
                type: boolean
              severity:
                type: string
                enum: [blocker, major, minor]
              message:
                type: string
              criterion:
                type: string
              file:
                type: string
              line:
                type: integer
                minimum: 1
        risks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [validator, area, message, human_required]
            properties:
              validator:
                type: string
              advisory:
                type: boolean
              area:
                type: string
              message:
                type: string
              human_required:
                type: boolean
        reasons:
          description: Why the change was rejected or needs a human.
          type: array
          items:
            type: string
    Usage:
      description: Model usage, for validators that call one (WU-053). Copied from the validator's verdict exactly as its runtime reported it; Plumbix computes, converts and estimates none of it. Absent when the validator reported none, and on runs stored before the field existed. cost_usd absent or null means the cost was not reported; 0 means it was reported as zero.
      type: object
      additionalProperties: false
      required: [model, input_tokens, output_tokens]
      properties:
        model:
          type: string
          minLength: 1
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        turns:
          description: Agentic turns an external reviewer took.
          type: integer
          minimum: 0
        cost_usd:
          description: "The reviewer's estimated spend, in US dollars. Absent or null: cost not reported; 0: reported as zero."
          type: [number, "null"]
          minimum: 0
        reasoning_tokens:
          description: Hidden reasoning tokens a reasoning model spent before answering.
          type: integer
          minimum: 0
        cache_read_tokens:
          description: Input tokens read from the provider's prompt cache; input_tokens counts only uncached input.
          type: integer
          minimum: 0
        cache_write_tokens:
          description: Input tokens written to the provider's prompt cache.
          type: integer
          minimum: 0
    Run:
      type: object
      additionalProperties: false
      required: [id, repo_id, branch, head, base, status, steps, started_at]
      properties:
        id:
          type: string
          pattern: "^run_[a-z2-7]{12}$"
        repo_id:
          type: string
        change_id:
          type: string
        branch:
          type: string
        pipeline:
          description: The triggered pipeline under .plumbix/pipelines/ this run ran (WU-045); absent for the change pipeline.
          type: string
        iteration:
          type: integer
          minimum: 1
        head:
          description: Commit being validated. Empty until fetched.
          type: string
        base:
          description: Merge base with the target branch. Empty until fetched.
          type: string
        status:
          type: string
          enum: [running, finished, errored, cancelled]
        outcome:
          $ref: "#/components/schemas/ChangeState"
        result:
          $ref: "#/components/schemas/ValidationResult"
        error:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStep"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    RunList:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    Problem:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    PipelineCheck:
      type: object
      additionalProperties: false
      required: [valid, disabled]
      properties:
        valid:
          type: boolean
        order:
          description: Step names in dependency order. Present when valid.
          type: array
          items:
            type: string
        errors:
          description: Every problem found. Present when not valid.
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
        disabled:
          description: True when a valid pipeline has a disabled step; such a pipeline never runs (WU-044). False for an invalid one.
          type: boolean
        blockers:
          description: Disabled steps counted per reason. Present when disabled.
          type: object
          additionalProperties:
            type: integer
            minimum: 1
    ImportPreview:
      type: object
      additionalProperties: false
      required: [branch, sha, source, pipelines, problems, files]
      properties:
        branch:
          type: string
        sha:
          type: string
        source:
          type: string
        files:
          description: The plan over the imported pipelines already on the branch (WU-048).
          type: array
          items:
            $ref: "#/components/schemas/ImportFile"
        pipelines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_file, name, file, content, disabled, blockers, steps, notes]
            properties:
              source_file:
                type: string
              name:
                type: string
              file:
                description: Where the pipeline would be written, .plumbix/pipelines/<name>.yaml.
                type: string
              content:
                description: The pipeline file as it would be written.
                type: string
              disabled:
                type: boolean
              blockers:
                type: object
                additionalProperties:
                  type: integer
                  minimum: 1
              steps:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name, file, line]
                  properties:
                    name:
                      type: string
                    reason:
                      description: Why the step is disabled; absent when it runs.
                      type: string
                    note:
                      type: string
                    file:
                      description: The file defining the source job, the pipeline file or a template (path@alias for another repository's, WU-047).
                      type: string
                    line:
                      description: The source job's line in that file.
                      type: integer
              notes:
                description: What did not carry over, such as dropped excludes or the pr trigger.
                type: array
                items:
                  type: string
        problems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_file, message]
            properties:
              source_file:
                type: string
              message:
                type: string
    ImportFile:
      description: One pipeline file of an import plan (WU-048).
      type: object
      additionalProperties: false
      required: [path, source_file, status, notes]
      properties:
        path:
          type: string
        source_file:
          type: string
        status:
          description: >
            added (a new source pipeline), updated, removed (its source
            pipeline is gone and nobody edited the file), unchanged, or kept
            (left as it is; the notes say why).
          type: string
          enum: [added, updated, removed, unchanged, kept]
        content:
          description: The file as it would be written; only for added and updated.
          type: string
        notes:
          description: What changed and what was kept, per step and for the pipeline's own fields.
          type: array
          items:
            type: string
    ImportChange:
      type: object
      additionalProperties: false
      required: [change, files]
      properties:
        change:
          $ref: "#/components/schemas/Change"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ImportFile"
    TriggeredPipelines:
      type: object
      additionalProperties: false
      required: [branch, sha, pipelines]
      properties:
        branch:
          type: string
        sha:
          type: string
        pipelines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, file, on, disabled, blockers, problems]
            properties:
              name:
                type: string
              file:
                type: string
              "on":
                description: What starts the pipeline; null when the file does not parse.
                oneOf:
                  - type: "null"
                  - type: object
                    additionalProperties: false
                    required: [manual]
                    properties:
                      push:
                        type: object
                        additionalProperties: false
                        required: [branches, paths]
                        properties:
                          branches:
                            type: array
                            items:
                              type: string
                          paths:
                            type: array
                            items:
                              type: string
                      manual:
                        type: boolean
              disabled:
                type: boolean
              blockers:
                description: What disables the pipeline, counted per reason; empty when it runs.
                type: object
                additionalProperties:
                  type: integer
                  minimum: 1
              problems:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineProblem"
    PipelineFile:
      type: object
      additionalProperties: false
      required: [file, branch, sha, content, pipeline, problems]
      properties:
        file:
          type: string
        branch:
          type: string
        sha:
          type: string
        content:
          description: The file as it is on the branch; empty when missing.
          type: string
        pipeline:
          oneOf:
            - $ref: "#/components/schemas/PipelineModel"
            - type: "null"
        problems:
          description: Why pipeline is null, when it is; empty otherwise.
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
        last_run:
          $ref: "#/components/schemas/PipelineLastRun"
    PipelineModel:
      description: The parsed file in the editor's shape. Lists are never null.
      type: object
      additionalProperties: false
      required: [version, steps, stages, disabled]
      properties:
        version:
          type: integer
        disabled:
          description: True when any step is disabled; the pipeline then never runs (WU-044).
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStep"
        stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, steps]
            properties:
              name:
                type: string
              steps:
                type: array
                items:
                  type: string
    PipelineStep:
      type: object
      additionalProperties: false
      required: [name, image, commands, needs, env, secrets, artifacts, cache, validator, advisory, external, retries, allow_failure, paths]
      properties:
        name:
          type: string
        image:
          type: string
        commands:
          description: The run script as a list of commands; one entry when the file had a string.
          type: array
          items:
            type: string
        needs:
          type: array
          items:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
        secrets:
          type: array
          items:
            type: string
        artifacts:
          type: array
          items:
            type: string
        cache:
          description: Absolute container paths kept between runs of the repository (WU-029).
          type: array
          items:
            type: string
        timeout:
          description: Go duration string; absent for the server default.
          type: string
        validator:
          type: boolean
        advisory:
          description: The validator's verdict is recorded but never counted (WU-030).
          type: boolean
        external:
          description: The validator waits for a reviewer outside the pipeline.
          type: boolean
        reviewer:
          description: The reviewer profile the validator step names; absent for the default.
          type: string
        effort:
          description: The step's reasoning effort override; absent for the profile's (WU-034).
          type: string
        retries:
          type: integer
        allow_failure:
          type: boolean
        paths:
          description: when.paths globs; empty when the step always runs.
          type: array
          items:
            type: string
        stage:
          type: string
        disabled:
          description: Why the step does not run; absent when it runs (WU-044). Reasons are listed in pipeline.schema.json.
          type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason:
              type: string
              enum: [user, docker, services, host, task, template, condition, checkout, deployment, secrets, variables]
            note:
              type: string
              maxLength: 500
    PipelineLastRun:
      type: object
      additionalProperties: false
      required: [run_id, head, steps]
      properties:
        run_id:
          type: string
        head:
          type: string
        steps:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [status, duration_ms]
            properties:
              status:
                type: string
              duration_ms:
                type: integer
    PipelineProposal:
      type: object
      additionalProperties: false
      required: [branch, title, content]
      properties:
        branch:
          description: The new branch; must not exist on the host.
          type: string
        target_branch:
          description: The branch to build on and merge into; default the first protected branch.
          type: string
        title:
          type: string
          maxLength: 200
        intent:
          type: string
          maxLength: 4000
        content:
          description: The whole pipeline file.
          type: string
          maxLength: 1048576
    PipelineProblem:
      type: object
      additionalProperties: false
      required: [path, line, message]
      properties:
        path:
          description: Location in the file, such as steps[1].needs[0]. Empty for whole-file problems.
          type: string
        line:
          description: Line number, or 0 when unknown.
          type: integer
        message:
          type: string
    WebhookResult:
      type: object
      additionalProperties: false
      required: [handled]
      properties:
        handled:
          description: Whether the delivery changed anything.
          type: boolean
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Error:
      description: Error shape shared by every endpoint.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              properties:
                problems:
                  description: Present on invalid_request errors. Lists every problem found.
                  type: array
                  items:
                    $ref: "#/components/schemas/Problem"
