openapi: 3.1.0
info:
  title: Plumbix API
  version: "1"
  description: >
    Public HTTP API of a Plumbix server. The server listens on loopback
    addresses only. Every operation except getHealth needs the bearer token
    from <data_dir>/api-token, which the server creates on first start.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://127.0.0.1:6400/api/v1
security:
  - bearerToken: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report that the server is running.
      security: []
      responses:
        "200":
          description: The server is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /pipelines/check:
    post:
      operationId: checkPipeline
      summary: Validate a pipeline file without running it.
      description: >
        The request body is the pipeline YAML. An invalid pipeline is a normal
        result with valid set to false, not an HTTP error. The file format is
        defined in pipeline.schema.json.
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              type: string
              maxLength: 1048576
      responses:
        "200":
          description: The check ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The body is larger than 1 MiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /repos:
    post:
      operationId: registerRepo
      summary: Register a git repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoInput"
      responses:
        "201":
          description: The repo was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      operationId: listRepos
      summary: List registered repos, oldest first.
      responses:
        "200":
          description: Every registered repo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /changes:
    post:
      operationId: submitChange
      summary: Submit a change with its intent and acceptance criteria.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeInput"
      responses:
        "201":
          description: The change was stored in state open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
    get:
      operationId: listChanges
      summary: List changes, oldest first.
      parameters:
        - name: repo_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/ChangeState"
      responses:
        "200":
          description: Matching changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /changes/{id}:
    get:
      operationId: getChange
      summary: Read one change.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /changes/{id}/close:
    post:
      operationId: closeChange
      summary: Close a change without merging.
      description: Allowed unless the change is already merged or closed.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The closed change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is already merged or closed (invalid_state), or changed state meanwhile (conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/validate:
    post:
      operationId: validateChange
      summary: Start a new validation iteration for a change.
      description: >
        Fetches the source branch, runs the pipeline and the validators, and
        moves the change to its outcome. A run still going for the change is
        cancelled. Submitting a change starts iteration 1 automatically.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "202":
          description: The run started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The change is merged or closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /changes/{id}/runs:
    get:
      operationId: listChangeRuns
      summary: List a change's runs by iteration.
      parameters:
        - $ref: "#/components/parameters/ChangeID"
      responses:
        "200":
          description: The change's runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /repos/{id}/runs:
    get:
      operationId: listRepoRuns
      summary: List a repo's runs, newest first.
      description: Includes plain runs started by pushes to branches without a change.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The repo's runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /runs/{id}:
    get:
      operationId: getRun
      summary: Read a run with its steps and combined result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /runs/{id}/steps/{step}/log:
    get:
      operationId: getStepLog
      summary: Read a step's log as plain text.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: step
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The log.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: The 64-character hex token in <data_dir>/api-token.
  parameters:
    ChangeID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    InvalidRequest:
      description: The body is not valid JSON, has unknown fields, or breaks field rules. details.problems lists every problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The repo or change does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The repo is already registered, or another change is open on the same source branch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: The body is larger than 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The bearer token is missing or wrong.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ChangeState:
      type: string
      enum: [open, running, approved, fix_requested, rejected, needs_human, escalated, merged, closed]
    Branch:
      description: A branch name following git's ref rules.
      type: string
      minLength: 1
      maxLength: 255
    RepoInput:
      type: object
      additionalProperties: false
      required: [host, url]
      properties:
        host:
          type: string
          enum: [github, azuredevops, git]
        url:
          description: >
            GitHub: https://github.com/<owner>/<repo>.
            Azure DevOps: https://dev.azure.com/<org>/<project>/_git/<repo>
            or https://<org>.visualstudio.com/<project>/_git/<repo>.
            Plain git: an absolute path to a repository on this machine
            (preferably bare), file:///path, ssh://[user@]host[:port]/path or
            user@host:path. SSH uses the server user's own keys.
          type: string
        protected_branches:
          description: Defaults to ["main"].
          type: array
          items:
            $ref: "#/components/schemas/Branch"
        merge_strategy:
          type: string
          enum: [squash, merge, rebase]
          default: squash
    Repo:
      type: object
      additionalProperties: false
      required: [id, host, url, protected_branches, merge_strategy, created_at]
      properties:
        id:
          type: string
          pattern: "^r_[a-z2-7]{12}$"
        host:
          type: string
          enum: [github, azuredevops, git]
        url:
          type: string
        protected_branches:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Branch"
        merge_strategy:
          type: string
          enum: [squash, merge, rebase]
        created_at:
          type: string
          format: date-time
    RepoList:
      type: object
      additionalProperties: false
      required: [repos]
      properties:
        repos:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
    Check:
      description: How the deterministic validator proves a criterion. Exactly one of steps or command.
      type: object
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          items:
            type: string
            pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        command:
          type: string
          minLength: 1
          maxLength: 2000
      oneOf:
        - required: [steps]
        - required: [command]
    Criterion:
      type: object
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          pattern: "^AC-[1-9][0-9]*$"
        text:
          type: string
          minLength: 1
          maxLength: 2000
        check:
          $ref: "#/components/schemas/Check"
    CriterionInput:
      description: Like Criterion, but id is optional. Missing ids get the smallest unused AC-<n>.
      type: object
      additionalProperties: false
      required: [text]
      properties:
        id:
          type: string
          pattern: "^AC-[1-9][0-9]*$"
        text:
          type: string
          minLength: 1
          maxLength: 2000
        check:
          $ref: "#/components/schemas/Check"
    ChangeInput:
      type: object
      additionalProperties: false
      required: [repo_id, source_branch, target_branch, title, intent, acceptance_criteria]
      properties:
        repo_id:
          type: string
        source_branch:
          $ref: "#/components/schemas/Branch"
        target_branch:
          $ref: "#/components/schemas/Branch"
        title:
          type: string
          minLength: 1
          maxLength: 200
        intent:
          type: string
          minLength: 1
          maxLength: 20000
        acceptance_criteria:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CriterionInput"
        constraints:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2000
        submitted_by:
          type: string
          maxLength: 100
    Change:
      type: object
      additionalProperties: false
      required: [id, repo_id, source_branch, target_branch, title, intent, acceptance_criteria, constraints, state, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^c_[a-z2-7]{12}$"
        repo_id:
          type: string
        source_branch:
          $ref: "#/components/schemas/Branch"
        target_branch:
          $ref: "#/components/schemas/Branch"
        title:
          type: string
        intent:
          type: string
        acceptance_criteria:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Criterion"
        constraints:
          type: array
          items:
            type: string
        submitted_by:
          type: string
        state:
          $ref: "#/components/schemas/ChangeState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChangeList:
      type: object
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
    RunStep:
      type: object
      additionalProperties: false
      required: [name, validator, status, exit_code, duration_ms]
      properties:
        name:
          type: string
        validator:
          type: boolean
        status:
          type: string
          enum: [succeeded, failed, timed_out, errored, skipped, cancelled]
        exit_code:
          type: integer
        duration_ms:
          type: integer
          minimum: 0
        error:
          type: string
    Assessment:
      type: object
      additionalProperties: false
      required: [validator, status, reason]
      properties:
        validator:
          type: string
        status:
          type: string
          enum: [met, unmet, unknown]
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
    ValidationResult:
      description: The combined outcome of an iteration's validators.
      type: object
      additionalProperties: false
      required: [state, criteria, findings, risks, reasons]
      properties:
        state:
          $ref: "#/components/schemas/ChangeState"
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, text, status, assessments]
            properties:
              id:
                type: string
              text:
                type: string
              status:
                type: string
                enum: [met, unmet, unknown]
              assessments:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"
        findings:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [validator, severity, message]
            properties:
              validator:
                type: string
              severity:
                type: string
                enum: [blocker, major, minor]
              message:
                type: string
              criterion:
                type: string
              file:
                type: string
              line:
                type: integer
                minimum: 1
        risks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [validator, area, message, human_required]
            properties:
              validator:
                type: string
              area:
                type: string
              message:
                type: string
              human_required:
                type: boolean
        reasons:
          description: Why the change was rejected or needs a human.
          type: array
          items:
            type: string
    Run:
      type: object
      additionalProperties: false
      required: [id, repo_id, branch, head, base, status, steps, started_at]
      properties:
        id:
          type: string
          pattern: "^run_[a-z2-7]{12}$"
        repo_id:
          type: string
        change_id:
          type: string
        branch:
          type: string
        iteration:
          type: integer
          minimum: 1
        head:
          description: Commit being validated. Empty until fetched.
          type: string
        base:
          description: Merge base with the target branch. Empty until fetched.
          type: string
        status:
          type: string
          enum: [running, finished, errored, cancelled]
        outcome:
          $ref: "#/components/schemas/ChangeState"
        result:
          $ref: "#/components/schemas/ValidationResult"
        error:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/RunStep"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    RunList:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
    Problem:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    PipelineCheck:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid:
          type: boolean
        order:
          description: Step names in dependency order. Present when valid.
          type: array
          items:
            type: string
        errors:
          description: Every problem found. Present when not valid.
          type: array
          items:
            $ref: "#/components/schemas/PipelineProblem"
    PipelineProblem:
      type: object
      additionalProperties: false
      required: [path, line, message]
      properties:
        path:
          description: Location in the file, such as steps[1].needs[0]. Empty for whole-file problems.
          type: string
        line:
          description: Line number, or 0 when unknown.
          type: integer
        message:
          type: string
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    Error:
      description: Error shape shared by every endpoint.
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              properties:
                problems:
                  description: Present on invalid_request errors. Lists every problem found.
                  type: array
                  items:
                    $ref: "#/components/schemas/Problem"
