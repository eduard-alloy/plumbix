# Builds a release when a tag v* is pushed, and on nothing else: four
# static binaries (darwin and linux, arm64 and amd64) with the web
# interface embedded, and their checksums, attached to a GitHub release
# named after the tag. Plumbix's own changes are validated by Plumbix,
# not here; this workflow only packages a commit that already landed.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the binaries and checksums
        run: make release VERSION="$GITHUB_REF_NAME"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Plumbix $GITHUB_REF_NAME"
